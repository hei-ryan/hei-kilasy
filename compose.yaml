services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: kilasy
      POSTGRES_USER: kilasy
      POSTGRES_PASSWORD: kilasy
    ports:
      - "5433:5432"

  # Development mail server: emails sent by Kilasy
  # are visible at http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
